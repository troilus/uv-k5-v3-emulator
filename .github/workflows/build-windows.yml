name: Build Windows EXE

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Download QEMU 7.2.0
        shell: msys2 {0}
        run: |
          curl -L -o qemu-7.2.0.tar.xz \
            https://download.qemu.org/qemu-7.2.0.tar.xz

      - name: Extract QEMU source
        shell: msys2 {0}
        run: |
          python3 -c "import tarfile; tarfile.open('qemu-7.2.0.tar.xz').extractall('.', filter='fully_trusted')"

      - name: Apply patches
        shell: msys2 {0}
        run: |
          QDIR=qemu-7.2.0

          # Machine model and patched SysTick
          cp qemu/py32f071.c "$QDIR/hw/arm/"
          cp qemu/armv7m_systick.c.patched "$QDIR/hw/timer/armv7m_systick.c"
          cp qemu/armv7m_systick.h.patched "$QDIR/include/hw/timer/armv7m_systick.h"

          # Win32 GUI (into hw/arm/ which is guaranteed to exist)
          cp qemu/win32-gui.c "$QDIR/hw/arm/"

          # Replace main.c with GUI-enabled version
          cp qemu/win32-main.c "$QDIR/system/main.c"

          echo "=== Patched files ==="
          ls "$QDIR/hw/arm/py32f071.c"
          ls "$QDIR/hw/arm/win32-gui.c"
          ls "$QDIR/system/main.c"

      - name: Patch Kconfig and meson.build
        shell: msys2 {0}
        run: |
          cd qemu-7.2.0

          if ! grep -q 'UVK5_V3' hw/arm/Kconfig; then
            cat >> hw/arm/Kconfig << 'KCONF'

          config UVK5_V3
              bool
              default y
              depends on TCG && ARM
              select PY32F071_SOC

          config PY32F071_SOC
              bool
              select ARM_V7M
              select UNIMP
          KCONF
          fi

          if ! grep -q 'UVK5_V3' hw/arm/meson.build; then
            sed -i "/arm_ss.add(when: 'CONFIG_STM32VLDISCOVERY'/a\\
          arm_ss.add(when: 'CONFIG_UVK5_V3', if_true: files('py32f071.c'))" \
              hw/arm/meson.build
          fi

      - name: Configure QEMU
        shell: msys2 {0}
        run: |
          cd qemu-7.2.0
          mkdir -p build && cd build
          ../configure \
            --target-list=arm-softmmu \
            --disable-docs \
            --disable-tools \
            --disable-sdl \
            --disable-gtk \
            --disable-vnc \
            --disable-spice \
            --disable-slirp \
            --disable-capstone \
            --disable-libusb

      - name: Build
        shell: msys2 {0}
        run: |
          cd qemu-7.2.0/build
          ninja qemu-system-arm

      - name: Collect artifacts
        shell: msys2 {0}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"

          cp qemu-7.2.0/build/arm-softmmu/qemu-system-arm.exe \
             "$GITHUB_WORKSPACE/release/uvk5.exe"

          python3 tools/make_flash.py --out "$GITHUB_WORKSPACE/release/flash.img"

          cp tools/key.py "$GITHUB_WORKSPACE/release/"
          cp tools/screenshot.py "$GITHUB_WORKSPACE/release/"
          cp tools/qmp_client.py "$GITHUB_WORKSPACE/release/"

          cat > "$GITHUB_WORKSPACE/release/README.txt" << 'README'
          UV-K5 V3 Emulator
          =================

          Quick start:
            1. Place your firmware.elf or firmware.bin in this directory
            2. Double-click uvk5.exe
            3. The LCD window appears and the firmware boots

          Keyboard controls:
            Arrow keys  = UP / DOWN / LEFT / RIGHT
            Enter       = MENU
            Escape      = EXIT
            F           = F key
            S           = STAR key
            Space       = SIDE1
            Shift       = SIDE2
            0-9         = Number keys

          You can also click the on-screen buttons with the mouse.
          README

      - name: Package as ZIP
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          7z a uvk5-v3-windows-x64.zip release/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uvk5-v3-windows-x64
          path: uvk5-v3-windows-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: uvk5-v3-windows-x64.zip
          generate_release_notes: true
